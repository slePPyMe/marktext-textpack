name: Isolated clipboard validation

on:
  push:
    branches: [codex/clipboard-validation-20261110]

permissions:
  contents: read

jobs:
  clipboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: candidate
            repository: slePPyMe/marktext-textpack
            ref: 32a11f95674215ea6cb3b7164d579894c4dc9762
          - source: upstream
            repository: marktext/marktext
            ref: ce4fc73568fa3da7bdaab6cb6f1aca06a28af7f6
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: slePPyMe/marktext-textpack
          ref: 32a11f95674215ea6cb3b7164d579894c4dc9762
          path: .clipboard-validation-input
          persist-credentials: false

      - name: Use identical portable tests for both product revisions
        run: |
          cp .clipboard-validation-input/packages/desktop/test/e2e/image-clipboard-3090.spec.ts packages/desktop/test/e2e/
          cp .clipboard-validation-input/packages/desktop/test/e2e/image-relative-path.spec.ts packages/desktop/test/e2e/
          test -z "$(git diff --name-only -- packages/desktop/src packages/muya/src package.json pnpm-lock.yaml)"
          git rev-parse HEAD
          sha256sum packages/desktop/test/e2e/image-clipboard-3090.spec.ts packages/desktop/test/e2e/image-relative-path.spec.ts

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev libfontconfig-dev xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgtk-3-0 libgbm1 libasound2t64

      - uses: ./.github/actions/setup

      - name: Build native modules and prepare assets
        run: pnpm tsx scripts/postinstall.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          npm_config_user_agent: pnpm
          USE_ELECTRON_CLANG: '0'

      - name: Run complete desktop unit suite and release selection tests
        if: matrix.source == 'candidate'
        run: |
          pnpm run test:unit --maxWorkers=2
          node --test scripts/tests/textpack-release.test.mjs

      - name: Build application
        run: pnpm build

      - name: Repeat real clipboard and file URL regressions
        run: xvfb-run --auto-servernum pnpm -C packages/desktop exec playwright test test/e2e/image-clipboard-3090.spec.ts test/e2e/image-relative-path.spec.ts --workers=1 --repeat-each=10 --retries=0 --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/clipboard-results.json

      - name: Run selected desktop integration regressions
        if: matrix.source == 'candidate'
        run: xvfb-run --auto-servernum pnpm -C packages/desktop exec playwright test test/e2e/find-replace.spec.ts test/e2e/find-session-5960.spec.ts test/e2e/find-reopen-select-3458.spec.ts test/e2e/search-prefill-from-selection.spec.ts test/e2e/issue-5292-anchor-links.spec.ts test/e2e/table-toolbar-tabs-5974.spec.ts test/e2e/textpack-session.spec.ts test/e2e/session-recovery-single.spec.ts test/e2e/session-recovery-multi.spec.ts test/e2e/image-relative-path.spec.ts test/e2e/image-edit-tool.spec.ts test/e2e/image-clipboard-3090.spec.ts test/e2e/issue-5344-image-content-hash.spec.ts test/e2e/issue-5394-image-resize-reload.spec.ts test/e2e/source-mode-reload-images.spec.ts test/e2e/diagram-viewer.spec.ts test/e2e/issue-5832-diagram-theme.spec.ts test/e2e/export-pdf.spec.ts test/e2e/issue-5541-export-render-container.spec.ts --workers=1 --retries=0 --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/selected-integration-results.json

      - name: Record integration counts
        if: always() && matrix.source == 'candidate'
        run: node -e "const fs=require('fs');if(fs.existsSync('selected-integration-results.json'))console.log('SELECTED_E2E '+JSON.stringify(JSON.parse(fs.readFileSync('selected-integration-results.json','utf8')).stats))"

      - name: Record test counts
        if: always()
        run: |
          node -e "const fs=require('fs');if(fs.existsSync('clipboard-results.json'))console.log(JSON.stringify(JSON.parse(fs.readFileSync('clipboard-results.json','utf8')).stats));else console.log('Tests did not complete; inspect preceding failed step')"
