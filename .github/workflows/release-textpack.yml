name: Release TextPack

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream stable tag (leave empty for the latest release)'
        required: false
        type: string
      publish:
        description: 'Publish after checks (otherwise leave a draft)'
        default: true
        type: boolean

concurrency:
  group: release-textpack
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    if: github.repository == 'slePPyMe/marktext-textpack'
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.release.outputs.needed }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      upstream_tag: ${{ steps.release.outputs.upstream_tag }}
      upstream_published_at: ${{ steps.release.outputs.upstream_published_at }}
      upstream_url: ${{ steps.release.outputs.upstream_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify release selection
        run: node --test scripts/tests/textpack-release.test.mjs
      - name: Detect a new upstream stable release
        id: release
        run: node scripts/textpack-release.mjs poll
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}

  prepare:
    needs: poll
    if: needs.poll.outputs.needed == 'true'
    runs-on: ubuntu-latest
    outputs:
      build_commit: ${{ steps.source.outputs.build_commit }}
      stable_head: ${{ steps.source.outputs.stable_head }}
      upstream_commit: ${{ steps.source.outputs.upstream_commit }}
      workflow_commit: ${{ steps.source.outputs.workflow_commit }}
      tag_exists: ${{ steps.source.outputs.tag_exists }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Merge the upstream release into the stable TextPack source
        id: source
        run: node scripts/textpack-release.mjs prepare
        env:
          UPSTREAM_TAG: ${{ needs.poll.outputs.upstream_tag }}
          RELEASE_VERSION: ${{ needs.poll.outputs.version }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: textpack-release-source
          path: release-source.bundle
          retention-days: 14
          if-no-files-found: error

  build:
    name: Check and build Windows x64
    needs: [poll, prepare]
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.poll.outputs.version }}
      BUILD_COMMIT: ${{ needs.prepare.outputs.build_commit }}
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: textpack-release-source
      - name: Check out the prepared release source
        run: |
          git fetch ./release-source.bundle HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Unable to load release source' }
          git checkout --detach $env:BUILD_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Unable to select release commit' }
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup
        with:
          node-version: '24.14.1'
      - name: Select Python for native modules
        run: |
          $python = Join-Path $env:pythonLocation 'python.exe'
          "npm_config_python=$python" >> $env:GITHUB_ENV
          "PYTHON=$python" >> $env:GITHUB_ENV
      - name: Prepare native modules and locales
        run: pnpm tsx scripts/postinstall.ts
        env:
          npm_config_user_agent: 'pnpm'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run ESLint
        run: pnpm lint
      - name: Run TypeScript typecheck
        run: pnpm typecheck
      - name: Run unit tests
        run: pnpm test
      - name: Build TextPack installer and ZIP
        run: pnpm run build:win:x64 --config electron-builder.textpack.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify downloads and update feed
        run: |
          $prefix = "marktext-textpack-win-x64-$env:RELEASE_VERSION"
          foreach ($name in @("$prefix-setup.exe", "$prefix.zip", 'latest.yml')) {
            if (!(Test-Path -LiteralPath (Join-Path dist $name))) { throw "Missing release artifact: $name" }
          }
          $feed = Get-Content -Raw dist/win-unpacked/resources/app-update.yml
          $url = 'https://github.com/slePPyMe/marktext-textpack/releases/latest/download/'
          if ($feed -notmatch 'provider:\s*generic' -or $feed -notmatch [regex]::Escape($url)) {
            throw 'The packaged updater must use this fork release downloads'
          }
          $metadata = Get-Content -Raw dist/latest.yml
          if ($metadata -notmatch [regex]::Escape($env:RELEASE_VERSION)) { throw 'Update metadata version mismatch' }
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -like "$prefix*" -or $_.Name -eq 'latest.yml' } | Sort-Object Name
          $sums = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $sums | Set-Content dist/SHA256SUMS.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: textpack-windows-x64
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/marktext-textpack-*.exe
            dist/marktext-textpack-*.zip
            dist/marktext-textpack-*.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt

  release:
    name: Publish TextPack release
    needs: [poll, prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_VERSION: ${{ needs.poll.outputs.version }}
      RELEASE_TAG: ${{ needs.poll.outputs.tag }}
      BUILD_COMMIT: ${{ needs.prepare.outputs.build_commit }}
      UPSTREAM_COMMIT: ${{ needs.prepare.outputs.upstream_commit }}
      UPSTREAM_URL: ${{ needs.poll.outputs.upstream_url }}
      UPSTREAM_PUBLISHED_AT: ${{ needs.poll.outputs.upstream_published_at }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: textpack-release-source
      - uses: actions/download-artifact@v8.0.2
        with:
          name: textpack-windows-x64
          path: dist
      - name: Push the checked source and release tag
        if: needs.prepare.outputs.tag_exists != 'true'
        env:
          SYNC_SSH_KEY: ${{ secrets.SYNC_UPSTREAM_SSH_KEY }}
          STABLE_HEAD: ${{ needs.prepare.outputs.stable_head }}
        run: |
          set -euo pipefail
          test -n "$SYNC_SSH_KEY" || { echo '::error::Missing repository deploy key'; exit 1; }
          git fetch ./release-source.bundle HEAD
          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/textpack-release.XXXXXX")
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SYNC_SSH_KEY" > "$ssh_dir/key"
          curl --fail --silent --show-error --retry 3 https://api.github.com/meta \
            | jq -r '.ssh_keys[] | "github.com \(.)"' > "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -F /dev/null -i '$ssh_dir/key' -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$ssh_dir/known_hosts'"
          remote_head=$(git ls-remote "git@github.com:$GITHUB_REPOSITORY.git" refs/heads/textpack-stable | cut -f1)
          if [[ "$remote_head" != "$STABLE_HEAD" && "$remote_head" != "$BUILD_COMMIT" ]]; then
            echo '::error::Stable source changed during the build; refusing to overwrite it'
            exit 1
          fi
          git push --atomic --no-follow-tags "git@github.com:$GITHUB_REPOSITORY.git" \
            "$BUILD_COMMIT:refs/heads/textpack-stable" "$BUILD_COMMIT:refs/tags/$RELEASE_TAG"
      - name: Write release notes
        run: |
          cat > release-notes.md <<EOF
          Unofficial MarkText TextPack for Windows x64, based on upstream **${RELEASE_VERSION}**.
          基于上游 **${RELEASE_VERSION}** 的非官方 TextPack 版，可将 Markdown 正文和本地图片保存在一个可继续编辑的文件中。

          - Installer / 安装版: \`marktext-textpack-win-x64-${RELEASE_VERSION}-setup.exe\`
          - ZIP / 解压运行版: \`marktext-textpack-win-x64-${RELEASE_VERSION}.zip\`
          - SHA-256 checksums / 校验和: \`SHA256SUMS.txt\`

          Open Markdown and use **File → Save As** with the \`.textpack\` extension. Local images are bundled; HTTP/HTTPS images remain remote.
          打开 Markdown 后，通过「文件 → 另存为」保存为 \`.textpack\`；本地图片会打包，HTTP/HTTPS 图片保留远程引用。

          Builds are unsigned and retain MarkText's application identity and settings path.
          构建未签名，沿用 MarkText 的应用标识与设置目录。

          Upstream release / 上游发布: [${RELEASE_VERSION}](${UPSTREAM_URL}), ${UPSTREAM_PUBLISHED_AT}
          Upstream commit: \`${UPSTREAM_COMMIT}\`
          TextPack source: [${BUILD_COMMIT}](https://github.com/${GITHUB_REPOSITORY}/commit/${BUILD_COMMIT})
          EOF
      - name: Upload assets to a draft
        id: draft
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft > release-state.json 2>/dev/null; then
            if [[ "$(jq -r .isDraft release-state.json)" != 'true' ]]; then
              echo 'draft=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "MarkText TextPack v${RELEASE_VERSION}" --notes-file release-notes.md --draft
          fi
          echo 'draft=true' >> "$GITHUB_OUTPUT"
      - name: Publish the completed release
        if: steps.draft.outputs.draft == 'true' && (github.event_name == 'schedule' || inputs.publish)
        run: gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
      - name: Link release
        run: |
          echo "TextPack release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"
