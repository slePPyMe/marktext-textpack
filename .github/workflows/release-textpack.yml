name: Release TextPack

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream stable tag (leave empty for the latest release)'
        required: false
        type: string
      publish:
        description: 'Publish after checks (otherwise leave a draft)'
        default: true
        type: boolean
      complete_existing:
        description: 'Add missing platforms to an existing mutable release; retain published binaries'
        default: false
        type: boolean

concurrency:
  group: release-textpack
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  poll:
    if: github.repository == 'slePPyMe/marktext-textpack'
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.release.outputs.needed }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      upstream_tag: ${{ steps.release.outputs.upstream_tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify release selection
        run: node --test scripts/tests/textpack-release.test.mjs
      - name: Detect upstream stable release
        id: release
        run: node scripts/textpack-release.mjs poll
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
          COMPLETE_EXISTING: ${{ inputs.complete_existing }}

  prepare:
    needs: poll
    if: needs.poll.outputs.needed == 'true'
    runs-on: ubuntu-latest
    outputs:
      build_commit: ${{ steps.source.outputs.build_commit }}
      stable_head: ${{ steps.source.outputs.stable_head }}
      upstream_commit: ${{ steps.source.outputs.upstream_commit }}
      workflow_commit: ${{ steps.source.outputs.workflow_commit }}
      tag_exists: ${{ steps.source.outputs.tag_exists }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare exact upstream stable source
        id: source
        run: node scripts/textpack-release.mjs prepare
        env:
          UPSTREAM_TAG: ${{ needs.poll.outputs.upstream_tag }}
          RELEASE_VERSION: ${{ needs.poll.outputs.version }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: textpack-release-source
          path: release-source.bundle
          retention-days: 14
          if-no-files-found: error

  build:
    name: Check and build (${{ matrix.name }})
    needs: [poll, prepare]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            platform: linux
            arch: x64
          - name: linux-arm64
            os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
          - name: windows-x64
            os: windows-latest
            platform: windows
            arch: x64
          - name: windows-arm64
            os: windows-11-arm
            platform: windows
            arch: arm64
          - name: macos-x64
            os: macos-15-intel
            platform: macos
            arch: x64
          - name: macos-arm64
            os: macos-15
            platform: macos
            arch: arm64
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_VERSION: ${{ needs.poll.outputs.version }}
      RELEASE_TAG: ${{ needs.poll.outputs.tag }}
      BUILD_COMMIT: ${{ needs.prepare.outputs.build_commit }}
      WORKFLOW_COMMIT: ${{ needs.prepare.outputs.workflow_commit }}
      CXXFLAGS: ${{ matrix.platform == 'macos' && '-std=gnu++20 -stdlib=libc++' || '' }}
    steps:
      - name: Enable Git long paths on Windows
        if: matrix.platform == 'windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Retain packaging tools from the triggering workflow
        run: cp scripts/textpack-artifacts.py "$RUNNER_TEMP/textpack-artifacts.py"
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install metadata parser
        run: python -m pip install PyYAML==6.0.3
      - name: Reuse verified existing binaries
        id: existing
        run: >-
          python "$RUNNER_TEMP/textpack-artifacts.py" reuse
          --version "$RELEASE_VERSION" --tag "$RELEASE_TAG"
          --platform '${{ matrix.platform }}' --arch '${{ matrix.arch }}'
      - uses: actions/download-artifact@v8.0.2
        if: steps.existing.outputs.reused != 'true'
        with:
          name: textpack-release-source
      - name: Check out application source and select packaging configuration
        if: steps.existing.outputs.reused != 'true'
        run: |
          git fetch ./release-source.bundle HEAD
          git checkout --detach "$BUILD_COMMIT"
          git show "$WORKFLOW_COMMIT:packages/desktop/electron-builder.textpack.yml" > packages/desktop/electron-builder.textpack.yml
      - name: Install Linux native build dependencies
        if: steps.existing.outputs.reused != 'true' && matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y icnsutils graphicsmagick xz-utils libx11-dev libxkbfile-dev gnome-keyring libsecret-1-dev libfontconfig-dev rpm
      - uses: ./.github/actions/setup
        if: steps.existing.outputs.reused != 'true'
        with:
          node-version: '24.14.1'
      - name: Select Python for native modules
        if: steps.existing.outputs.reused != 'true'
        run: |
          python -c 'import sys; print("npm_config_python=" + sys.executable); print("PYTHON=" + sys.executable)' >> "$GITHUB_ENV"
      - name: Prepare native modules and locales
        if: steps.existing.outputs.reused != 'true'
        run: pnpm tsx scripts/postinstall.ts
        env:
          npm_config_user_agent: pnpm
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_ELECTRON_CLANG: ${{ matrix.platform == 'linux' && '0' || '' }}
      - name: Run lint, typecheck and unit tests
        if: steps.existing.outputs.reused != 'true'
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: Build Windows packages
        if: steps.existing.outputs.reused != 'true' && matrix.platform == 'windows'
        run: pnpm run build:win:${{ matrix.arch }} --config electron-builder.textpack.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build macOS packages
        if: steps.existing.outputs.reused != 'true' && matrix.platform == 'macos'
        run: pnpm run build:mac:${{ matrix.arch }} --config electron-builder.textpack.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build Linux x64 packages
        if: steps.existing.outputs.reused != 'true' && matrix.platform == 'linux' && matrix.arch == 'x64'
        run: pnpm run build:linux:x64 --config electron-builder.textpack.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Linux ARM64 packages
        if: steps.existing.outputs.reused != 'true' && matrix.platform == 'linux' && matrix.arch == 'arm64'
        run: pnpm run build:linux:arm64 --config electron-builder.textpack.yml '-c.linux.artifactName=marktext-textpack-linux-arm64-${version}.${ext}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify package types, checksums and fork updater
        if: steps.existing.outputs.reused != 'true'
        run: >-
          python "$RUNNER_TEMP/textpack-artifacts.py" verify-platform
          --version "$RELEASE_VERSION" --platform '${{ matrix.platform }}' --arch '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: textpack-platform-${{ matrix.name }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.blockmap
            dist/*.yml
            dist/*.AppImage
            dist/*.snap
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  release:
    name: Publish complete TextPack release
    needs: [poll, prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_VERSION: ${{ needs.poll.outputs.version }}
      RELEASE_TAG: ${{ needs.poll.outputs.tag }}
      BUILD_COMMIT: ${{ needs.prepare.outputs.build_commit }}
      UPSTREAM_COMMIT: ${{ needs.prepare.outputs.upstream_commit }}
      WORKFLOW_COMMIT: ${{ needs.prepare.outputs.workflow_commit }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: textpack-release-source
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: textpack-platform-*
          path: artifacts
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Verify and merge platform metadata
        run: |
          python -m pip install PyYAML==6.0.3
          python -m unittest discover -s scripts/tests -p 'test_textpack_artifacts.py'
          python scripts/merge-release-artifacts.py artifacts dist "$RELEASE_VERSION"
          python scripts/textpack-artifacts.py verify-release --version "$RELEASE_VERSION"
      - name: Push checked source and new release tag
        if: needs.prepare.outputs.tag_exists != 'true'
        env:
          SYNC_SSH_KEY: ${{ secrets.SYNC_UPSTREAM_SSH_KEY }}
          STABLE_HEAD: ${{ needs.prepare.outputs.stable_head }}
        run: |
          set -euo pipefail
          test -n "$SYNC_SSH_KEY" || { echo '::error::Missing repository deploy key'; exit 1; }
          git fetch ./release-source.bundle HEAD
          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/textpack-release.XXXXXX")
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SYNC_SSH_KEY" > "$ssh_dir/key"
          curl --fail --silent --show-error --retry 3 https://api.github.com/meta \
            | jq -r '.ssh_keys[] | "github.com \(.)"' > "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -F /dev/null -i '$ssh_dir/key' -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$ssh_dir/known_hosts'"
          remote_head=$(git ls-remote "git@github.com:$GITHUB_REPOSITORY.git" refs/heads/textpack-stable | cut -f1)
          if [[ "$remote_head" != "$STABLE_HEAD" && "$remote_head" != "$BUILD_COMMIT" ]]; then
            echo '::error::Stable source changed during the build; refusing to overwrite it'
            exit 1
          fi
          git push --atomic --no-follow-tags "git@github.com:$GITHUB_REPOSITORY.git" \
            "$BUILD_COMMIT:refs/heads/textpack-stable" "$BUILD_COMMIT:refs/tags/$RELEASE_TAG"
      - name: Write complete release notes
        run: python scripts/textpack-artifacts.py notes --version "$RELEASE_VERSION"
      - name: Upload assets and publish
        run: |
          options=()
          if [[ '${{ inputs.complete_existing }}' == 'true' ]]; then options+=(--complete-existing); fi
          if [[ '${{ github.event_name }}' == 'schedule' || '${{ inputs.publish }}' == 'true' ]]; then options+=(--publish); fi
          python scripts/textpack-artifacts.py publish --version "$RELEASE_VERSION" --tag "$RELEASE_TAG" "${options[@]}"
      - name: Link release
        run: |
          echo "TextPack release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"
