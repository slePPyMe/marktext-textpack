name: Deploy TextPack project pages

on:
  push:
    branches: [textpack]
    paths:
      - docs/textpack-site/**
      - scripts/build-textpack-site.mjs
      - .github/workflows/textpack-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: textpack-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'slePPyMe/marktext-textpack'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.14.1'
      - name: Build static Chinese and English pages
        run: node scripts/build-textpack-site.mjs
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist/textpack-site
      - name: Deploy project pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
